name: Validate Portfolio

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: cardio-ctgov-living-meta-portfolio

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run generated-output validator
        working-directory: cardio-ctgov-living-meta-portfolio
        run: npm run validate:generated

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: structural-validation

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: cardio-ctgov-living-meta-portfolio

      - name: Check out shared app repository
        uses: actions/checkout@v6
        with:
          repository: mahmood726-cyber/esc-acs-living-meta
          path: esc-acs-living-meta
          token: ${{ secrets.GH_REPO_READ_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Playwright package
        working-directory: cardio-ctgov-living-meta-portfolio
        run: npm install --no-save playwright

      - name: Install Chromium
        working-directory: cardio-ctgov-living-meta-portfolio
        run: npx playwright install --with-deps chromium

      - name: Start local server
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m http.server 8767 --directory . >/tmp/portfolio-http.log 2>&1 &
          echo $! >/tmp/portfolio-http.pid

      - name: Run browser validation
        working-directory: cardio-ctgov-living-meta-portfolio
        run: node scripts/browser-validate.mjs

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/portfolio-http.pid ]; then
            kill "$(cat /tmp/portfolio-http.pid)" || true
          fi

      - name: Upload browser validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: cardio-ctgov-living-meta-portfolio/generated/browser-validation.json
          if-no-files-found: warn
